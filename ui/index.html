<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KC Control</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <header>
    <div class="status">
      <span id="status-dot" class="dot"></span>
      <div>
        <div id="status-text" class="status-text">Connecting…</div>
        <div id="status-app" class="muted"></div>
      </div>
    </div>
    <span id="saved" class="saved muted" aria-live="polite"></span>
  </header>

  <main>
    <section>
      <h2>App rules</h2>
      <p class="muted">When one of these apps comes to the front, the mouse switches to its profile.</p>
      <div id="rules" class="card list"></div>

      <form id="add-rule" class="card add">
        <input id="add-app" list="recent-apps" placeholder="App, e.g. photoshop.exe" autocomplete="off" spellcheck="false" required>
        <datalist id="recent-apps"></datalist>
        <button id="browse" type="button" title="Choose an app from disk">Browse…</button>
        <select id="add-profile" aria-label="Profile"></select>
        <button type="submit">Add</button>
      </form>
      <div id="recent" class="chips" aria-label="Recently used apps"></div>

      <div class="card row">
        <label for="default-profile">All other apps</label>
        <select id="default-profile"></select>
      </div>
    </section>

    <section>
      <h2>General</h2>
      <label class="card row toggle" for="autostart">
        <span>Start when I sign in</span>
        <input id="autostart" type="checkbox" role="switch">
      </label>
    </section>

    <section>
      <h2>Profile names</h2>
      <p class="muted">The mouse doesn't store names, so they're kept on this computer.</p>
      <div id="names" class="card list"></div>
    </section>
  </main>
</body>
</html>
